{# Reusable Empty State Partial #}
<div class="text-center py-5 px-3">
  <div class="mb-3">
    <i class="bi {{ icon or 'bi-inbox' }} text-muted opacity-50" style="font-size: 3.5rem;"></i>
  </div>
  <h5 class="fw-bold text-dark mb-2">{{ title or 'Belum ada data' }}</h5>
  <p class="text-muted small mb-4 mx-auto" style="max-width: 450px;">
    {{ message or 'Data tidak ditemukan atau belum tersedia dalam sistem.' }}
  </p>
  {% if action_url and action_text %}
  <a href="{{ action_url }}" class="btn btn-gold-cta px-4 rounded-pill">
    {{ action_text }}
  </a>
  {% endif %}
</div>
